name: Build Windows installer

# Builds the packaged Windows app and installer on GitHub's Windows runners
# (PyInstaller can't cross-compile from Linux/macOS, so this is the reliable
# way to produce a real .exe). Run it manually from the Actions tab, or it
# runs automatically when you push a version tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch RubberBand CLI (bundled for beatmatched rendering)
        shell: pwsh
        continue-on-error: true   # build still works via the librosa fallback if this fails
        run: |
          $url = "https://breakfastquay.com/files/releases/rubberband-3.3.0-gpl-executable-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile rb.zip -UseBasicParsing
          Expand-Archive rb.zip -DestinationPath rb_extract -Force
          New-Item -ItemType Directory -Force -Path vendor/rubberband | Out-Null
          Get-ChildItem -Recurse rb_extract -Include *.exe,*.dll | Copy-Item -Destination vendor/rubberband -Force
          Write-Host "Bundled RubberBand files:"
          Get-ChildItem vendor/rubberband

      - name: Build app with PyInstaller
        run: pyinstaller forthemix.spec

      - name: Compile installer with Inno Setup
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ForTheMix-Windows-Installer
          path: Output/*.exe
          if-no-files-found: error

      - name: Upload raw app folder (fallback, no installer needed)
        uses: actions/upload-artifact@v4
        with:
          name: ForTheMix-Windows-App
          path: dist/ForTheMix/**
